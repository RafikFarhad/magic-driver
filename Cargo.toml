[workspace]
resolver = "3"
members = ["crates/md-core", "crates/md-trace", "crates/magic-driver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
md-core = { path = "crates/md-core" }
md-trace = { path = "crates/md-trace" }
clap = { version = "4.6", features = ["derive"] }
evdev = "0.13.2"
insta = "1.49"
nix = { version = "0.29", features = ["event", "fs", "poll", "signal", "time"] }
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
toml = "1.1"
udev = "0.9.3"

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
ref_option = "allow"
