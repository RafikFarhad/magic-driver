[workspace]
resolver = "3"
members = ["crates/md-core", "crates/md-trace", "crates/magic-driver", "crates/magic-driver-inspector"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/RafikFarhad/magic-driver"
authors = ["Rafik Farhad <rafikfarhad@gmail.com>"]
publish = false

[workspace.dependencies]
md-core = { path = "crates/md-core" }
md-trace = { path = "crates/md-trace" }
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["system_fonts", "glow", "wayland", "x11"] }
evdev = "0.13.2"
insta = "1.49"
nix = { version = "0.29", features = ["event", "fs", "poll", "signal", "socket", "time", "user"] }
proptest = "1.11"
raw-window-handle = "0.6"
sd-notify = "0.5.0"
smithay-client-toolkit = { version = "0.20", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std", "ansi"] }
udev = "0.9.3"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
ref_option = "allow"
